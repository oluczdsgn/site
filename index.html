<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olucz Studio | Branding, site e embalagem</title>
<meta name="description" content="Olucz Studio é um estúdio de branding, site e embalagem. Design criativo e autêntico.">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/oluczdsgn/site/main/materiais/LOGO%202.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f2ede7;--mute:#8a867f;--line:#2a2927;--serif:"Instrument Serif",Georgia,serif;--sans:"Inter Tight",Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.hl{position:relative;display:inline-block}
.hl::after{content:"";position:absolute;left:0;bottom:-2px;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.hl:hover::after{transform:scaleX(1);transform-origin:left}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 18px;mix-blend-mode:difference;font-size:13px}
header .logo{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:22px;text-transform:uppercase;letter-spacing:.02em;transition:letter-spacing .5s var(--ease)}

header .logo img{height:64px;width:auto;transition:transform .6s var(--ease)}
header .logo:hover img{transform:rotate(-12deg) scale(1.15)}
header nav{display:flex;gap:26px}
header nav:last-child{justify-content:flex-end}
header .l{justify-self:start}
.hero{min-height:78vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:120px 20px 60px}
h1,h2{font-family:var(--serif);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:-.01em}
h1{font-size:clamp(40px,7.4vw,112px);max-width:14ch;margin:auto}
h2{font-size:clamp(34px,5.4vw,80px)}
.w{display:inline-block;transition:transform .5s var(--ease),color .3s,font-style .3s;cursor:default}
.w:hover{transform:translateY(-.12em) skewX(-8deg);color:#ff5a1f}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 18px;max-width:1280px;margin:0 auto}
.tile{position:relative;aspect-ratio:1;overflow:hidden;display:block;background:#0b0b0b}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease),filter .6s}
.tile:hover img{transform:scale(1.09);filter:brightness(.45)}
.tile .info{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--fg);pointer-events:none}
.tile .top{display:flex;justify-content:space-between;font-size:12px;opacity:0;transform:translateY(-8px);transition:.5s var(--ease)}
.tile .name{font-family:var(--serif);font-size:clamp(26px,3vw,44px);text-transform:uppercase;line-height:.95;transform:translateY(12px);opacity:0;transition:.55s var(--ease)}
.tile:hover .top,.tile:hover .name{opacity:1;transform:none}
.tile .arr{display:inline-block;transition:transform .5s var(--ease)}
.tile:hover .arr{transform:translate(4px,-4px) rotate(8deg)}
.label{font-size:12px;color:var(--mute)}
.txt{background:#000;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;justify-content:space-between;transition:background .5s,color .5s}
.txt:hover{background:var(--fg);color:#000}
.txt p{font-size:clamp(15px,1.5vw,22px);max-width:20ch}
.more{text-align:center;padding:60px 20px}
.sec{padding:120px 20px 70px;text-align:center}
.steps{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.step{padding:18px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .5s,color .5s}
.step:last-child{border-right:0}
.step:hover{background:var(--fg);color:#000}
.step b{font-weight:400;font-size:clamp(70px,9vw,140px);line-height:.9;transition:transform .6s var(--ease);display:inline-block}
.step:hover b{transform:translateX(10px) scale(1.05)}
.step strong{font-weight:500;display:block;margin-bottom:4px}
.contact{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);min-height:300px}
.contact>div{padding:18px;display:flex;flex-direction:column;gap:6px;font-size:clamp(15px,1.5vw,20px)}
.contact>div:first-child{border-right:1px solid var(--line)}
.contact .label{margin-bottom:8px}
.contact div div{display:flex;flex-direction:column;gap:2px}
.big{font-family:var(--serif);text-transform:uppercase;font-size:17.6vw;line-height:.85;text-align:center;padding:30px 0 0;white-space:nowrap;overflow:hidden}
.big span{display:inline-block;transition:transform .6s var(--ease),color .3s}
.big span:hover{transform:translateY(-.08em);color:#ff5a1f}
.copy{padding:14px 18px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
/* about */
.about{padding:150px 18px 40px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;min-height:80vh}
.about .logo-big{width:min(100%,360px);transition:transform .8s var(--ease)}
.about .logo-big:hover{transform:rotate(6deg) scale(1.04)}
.about p{font-size:clamp(20px,2.2vw,32px);line-height:1.2;margin-top:30px;max-width:28ch}
.srv{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:60px}
.srv div{padding:22px 18px 60px;border-right:1px solid var(--line);font-family:var(--serif);font-size:clamp(28px,4vw,56px);text-transform:uppercase;transition:background .5s,color .5s,padding .5s var(--ease)}
.srv div:last-child{border-right:0}
.srv div:hover{background:var(--fg);color:#000;padding-left:30px}
/* project */
.ph{padding:150px 18px 50px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.ph h1{margin:0;text-align:left;max-width:none}
.imgs{display:flex;flex-direction:column;align-items:center;gap:36px;padding:0 18px;max-width:1100px;margin:0 auto}
.imgs figure{display:flex;justify-content:center;max-width:100%}
.imgs img{width:auto;height:auto;max-width:100%;transition:transform .8s var(--ease)}
.imgs figure:hover img{transform:scale(1.02)}
.nav2{display:flex;justify-content:space-between;padding:40px 18px;font-family:var(--serif);font-size:clamp(28px,4vw,56px);text-transform:uppercase}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
/* cursor */
#cur{position:fixed;left:0;top:0;width:14px;height:14px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:99;transform:translate(-50%,-50%);transition:width .35s var(--ease),height .35s var(--ease);display:none}
#cur.big{width:64px;height:64px}
@media(hover:hover) and (pointer:fine){#cur{display:block}}
@media(max-width:820px){
 header{grid-template-columns:auto 1fr;gap:10px}
 header .l{display:none}
 header .logo img{height:52px}
 header nav:last-child{gap:16px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .grid{gap:10px;padding:0 12px}
 .tile .top,.tile .name{opacity:1;transform:none}
 .tile img{filter:brightness(.6)}
 .steps{grid-template-columns:1fr 1fr}
 .step:nth-child(2n){border-right:0}
 .step{min-height:220px}
 .contact{grid-template-columns:1fr}
 .contact>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
 .about{grid-template-columns:1fr;padding-top:110px}
 .srv{grid-template-columns:1fr}
 .srv div{border-right:0;border-bottom:1px solid var(--line);padding-bottom:24px}
 .imgs{gap:20px;padding:0 12px}
 .hero{min-height:62vh}
}
</style>
</head>
<body>
<div id="cur"></div>
<header>
 <nav class="l"></nav>
 <a class="logo" href="#/" aria-label="Olucz Studio"><img src="https://raw.githubusercontent.com/oluczdsgn/site/main/materiais/LOGO%202.png" alt="Logo Olucz Studio"></a>
 <nav><a class="hl" href="#/trabalhos">Trabalhos</a><a class="hl" href="#/sobre">Sobre</a><a class="hl" href="#contato">Contato</a></nav>
</header>
<main id="app"></main>
<script>
const BASE="https://raw.githubusercontent.com/oluczdsgn/site/main/";
const LOGO=BASE+"materiais/LOGO%202.png";
const P=[
 {n:"Cativeiro Tattoo",f:["1","2","3","4","5","6","7","8"]},
 {n:"Dona Cookies",f:["1","2","3","4","5","6"]},
 {n:"Embarq",f:["1","2","3","4","5","6","7"]},
 {n:"Flor de Rua",f:["1","2","3","4","5","6","7","8","9"]},
 {n:"Good Pizza",f:["1","2","3","4","5","6","7"]},
 {n:"Run Fire Club",f:["1","2","3","4","5","6","7","8","9"]},
 {n:"Sea view",f:["1","2","3","4","4-1","5"]},
 {n:"Tenis Prime",f:["1","2","3","4","5"]},
 {n:"Umshini",f:["1","2","3","4","5","6","7","Prancheta 1"]}
];
const slug=s=>s.toLowerCase().replace(/\s+/g,"");
const img=(p,f)=>BASE+encodeURIComponent(p.n)+"/"+encodeURIComponent(f)+".png";
const words=t=>t.split(" ").map(w=>`<span class="w">${w}</span>`).join(" ");
const tile=(p,i)=>`<a class="tile" href="#/projeto/${slug(p.n)}"><img loading="lazy" src="${img(p,"1")}" alt="${p.n}"><div class="info"><div class="top"><span>${String(i+1).padStart(2,"0")}</span><span class="arr">↗</span></div><div class="name">${p.n}</div></div></a>`;
const footer=`<footer id="contato">
<div class="contact"><div><span class="label">Contato</span><a class="hl" href="mailto:contato@oluczstudio.com">contato@oluczstudio.com</a></div>
<div><span class="label">Redes</span><div><a class="hl" href="https://instagram.com/oluczdsgn" target="_blank" rel="noopener">Instagram</a><a class="hl" href="https://github.com/oluczdsgn" target="_blank" rel="noopener">GitHub</a></div></div></div>
<div class="big">${"OLUCZ STUDIO".split("").map(c=>c===" "?" ":`<span>${c}</span>`).join("")}</div>
<div class="copy"><span>© Olucz Studio 2026</span><span>Branding, site e embalagem</span></div></footer>`;

function home(){return `
<section class="hero"><h1>${words("Um estúdio de design para marcas com personalidade")}</h1></section>
<div class="grid">
${P.map(tile).join("")}
<div class="txt"><span class="label">Olucz Studio</span><p>Branding, site e embalagem criados com autenticidade.</p></div>
<a class="tile txt" style="aspect-ratio:1" href="#/sobre"><span class="label">Sobre</span><p>Conheça o estúdio <span class="arr">↗</span></p></a>
<a class="tile txt" style="aspect-ratio:1" href="#contato"><span class="label">Contato</span><p>Vamos criar algo juntos <span class="arr">↗</span></p></a>
</div>
<div class="more"><a class="hl" href="#/trabalhos">Ver todos os trabalhos ↗</a></div>
<section class="sec rv"><h2>${words("Nosso processo começa e termina com criatividade")}</h2></section>
<div class="steps rv">
<div class="step"><span class="label">Olucz Studio</span><span>Nosso processo em três etapas</span></div>
<div class="step"><b>1</b><span><strong>Imergir</strong>Entendemos sua marca, seu público e seus objetivos.</span></div>
<div class="step"><b>2</b><span><strong>Criar</strong>Damos forma à marca em identidade, site e embalagem.</span></div>
<div class="step"><b>3</b><span><strong>Entregar</strong>Preparamos sua marca para crescer com consistência.</span></div>
</div>
<section class="sec rv"><h2>${words("Sua marca está pronta para se destacar?")}</h2></section>
${footer}`}

function works(){return `<section class="ph"><h1>${words("Trabalhos")}</h1><span class="label">${P.length} projetos</span></section><div class="grid">${P.map(tile).join("")}</div>${footer}`}

function about(){return `
<section class="about"><div><img class="logo-big" src="${LOGO}" alt="Logo Olucz Studio"></div>
<div><h2>${words("Sobre o estúdio")}</h2>
<p>O Olucz Studio é um estúdio de branding, site e embalagem. Acreditamos que uma marca forte nasce de ideias criativas e de uma identidade autêntica. Criamos design com personalidade, que conversa com as pessoas e reflete a essência de cada cliente.</p></div></section>
<div class="srv rv"><div>Branding</div><div>Site</div><div>Embalagem</div></div>
${footer}`}

function project(s){
 const i=P.findIndex(p=>slug(p.n)===s); if(i<0) return works();
 const p=P[i],nx=P[(i+1)%P.length],pv=P[(i+P.length-1)%P.length];
 return `<section class="ph"><h1>${words(p.n)}</h1><span class="label">${String(i+1).padStart(2,"0")} / ${String(P.length).padStart(2,"0")}</span></section>
<div class="imgs">${p.f.map(f=>`<figure class="rv"><img loading="lazy" src="${img(p,f)}" alt="${p.n}"></figure>`).join("")}</div>
<div class="nav2"><a class="hl" href="#/projeto/${slug(pv.n)}">← ${pv.n}</a><a class="hl" href="#/projeto/${slug(nx.n)}">${nx.n} →</a></div>${footer}`}

function route(){
 const h=location.hash.replace("#","")||"/";
 if(h==="contato"){document.getElementById("contato")?.scrollIntoView();return}
 const app=document.getElementById("app");
 if(h.startsWith("/projeto/")) app.innerHTML=project(h.split("/")[2]);
 else if(h==="/trabalhos") app.innerHTML=works();
 else if(h==="/sobre") app.innerHTML=about();
 else app.innerHTML=home();
 window.scrollTo(0,0); observe();
}
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
function observe(){document.querySelectorAll(".rv").forEach(el=>io.observe(el))}
window.addEventListener("hashchange",route);route();
/* cursor */
const cur=document.getElementById("cur");
addEventListener("mousemove",e=>{cur.style.left=e.clientX+"px";cur.style.top=e.clientY+"px"});
document.addEventListener("mouseover",e=>cur.classList.toggle("big",!!e.target.closest("a,.w,.step,.srv div,.big span")));
</script>
</body>
</html>
